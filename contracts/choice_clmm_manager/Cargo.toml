[package]
name = "choice_clmm_manager"
version = "1.1.2"
authors = ["Dan Van Eijck"]
edition = "2018"
description = "Common choice CLMM types"
license = "Apache-2.0"
repository = "https://github.com/choice-exchange/choice_exchange"
homepage = "https://choice.exchange"
documentation = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# for quicker tests, cargo test --lib
# for more explicit tests, cargo test --features=backtraces
library = []

[dependencies]
cw2                  = { version = "2.0.0" }
cw20                 = { version = "2.0.0" } 
cosmwasm-schema      = { version = "2.2.2" }
cosmwasm-std         = { version = "2.2.2", features = [ "abort", "cosmwasm_1_2", "cosmwasm_1_3", "cosmwasm_1_4", "cosmwasm_2_0", "iterator", "stargate" ] }
cw-storage-plus      = { version = "2.0.0" }

cw721 = "0.20.0"
cw721-base = "0.20.0"
cw721-metadata-onchain = "0.20.0"

injective-cosmwasm  = { version = "0.3.4-1" }
injective-math      = { version = "0.3.4-1" }

thiserror            = { version = "2.0.12" }

schemars = "0.8.22"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

choice-clmm-common = { workspace = true }
choice-clmm-math = { workspace = true }