[package]
name = "malicious-cw20"
version = "0.1.0"
authors = ["Dan Van Eijck"]
edition = "2021"
description = "Test-only adversarial CW20 (fee-on-transfer / revert-on-transfer / reentrant) for CLMM blast-radius integration tests"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-schema = { version = "2.2.2" }
cosmwasm-std = { version = "2.2.2" }
cw-storage-plus = { version = "2.0.0" }
cw20 = { version = "2.0.0" }
cw-utils = { version = "2.0.0" }
schemars = "0.8.22"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
# Partial builds (incl. the workspace-optimizer's per-contract release build)
# drop `alloc` on ed25519-zebra via feature unification, which breaks
# cosmwasm-crypto. Same workaround as cw20_base_build.
ed25519-zebra = { version = "4.1.0" }
