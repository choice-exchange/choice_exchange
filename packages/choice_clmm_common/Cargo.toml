[package]
name = "choice-clmm-common"
version = "1.1.2"
authors = ["Dan Van Eijck"]
edition = "2018"
description = "Common choice CLMM types"
license = "Apache-2.0"
repository = "https://github.com/choice-exchange/choice_exchange"
homepage = "https://choice.exchange"
documentation = ""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# for quicker tests, cargo test --lib
# for more explicit tests, cargo test --features=backtraces

[dependencies]
cw2                  = { version = "2.0.0" }
cw20                 = { version = "2.0.0" } 
cosmwasm-schema      = { version = "2.2.2" }
cosmwasm-std         = { version = "2.2.2", features = [ "abort", "cosmwasm_1_2", "cosmwasm_1_3", "cosmwasm_1_4", "cosmwasm_2_0", "iterator", "stargate" ] }

cw721 = "0.20.0"
cw-utils = "2.0.0"

schemars = "0.8.22"
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

[dev-dependencies]
injective-test-tube = { version = "1.16.3-1" }
choice = { path = "../choice" }
choice-farm = { path = "../../contracts/choice_farm" }
choice-vault = { path = "../../contracts/choice_vault" }
choice-zap-lp = { path = "../../contracts/choice_zap_lp" }
# Test-only flash-loan borrower (FlashCallback round-trip integration test).
flash-borrower-mock = { path = "../../contracts/flash_borrower_mock" }
# Test-only adversarial CW20 (fee-on-transfer / revert / reentrant) for the
# malicious-token blast-radius integration test.
malicious-cw20 = { path = "../../contracts/malicious_cw20" }
# Types only — the WASM artifact for the on-chain CW20 lives in
# `contracts/cw20_base_build/` and is produced by `./build_release.sh`.
cw20-base = { version = "2.0.0", features = ["library"] }

[[test]]
name = "integration"
path = "../../tests/integration.rs"
harness = true

[[test]]
name = "visualization"
path = "../../tests/visualization.rs"
harness = true

[[test]]
name = "vault_integration"
path = "../../tests/vault_integration.rs"
harness = true

[[test]]
name = "manager_solvency_fuzz"
path = "../../tests/manager_solvency_fuzz.rs"
harness = true

[[test]]
name = "manager_nft_attribution"
path = "../../tests/manager_nft_attribution.rs"
harness = true

[[test]]
name = "malicious_cw20_blast_radius"
path = "../../tests/malicious_cw20_blast_radius.rs"
harness = true

[[test]]
name = "zap_lp_integration"
path = "../../tests/zap_lp_integration.rs"
harness = true

[[test]]
name = "cw20_accounting_fuzz"
path = "../../tests/cw20_accounting_fuzz.rs"
harness = true

[[test]]
name = "factory_lifecycle"
path = "../../tests/factory_lifecycle.rs"
harness = true