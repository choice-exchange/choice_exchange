[workspace]
members = ["packages/*", "contracts/*"]
resolver = "2"

[workspace.dependencies]
choice-clmm-math = { path = "./packages/choice_clmm_math" }
choice-clmm-common = { path = "./packages/choice_clmm_common" }

[profile.release.package.choice]
opt-level = 3
debug = false
debug-assertions = false
codegen-units = 1
incremental = false

[profile.release]
rpath = false
lto = true
overflow-checks = true
panic = 'abort'

[profile.release.package."choice-pair"]
opt-level = 3
debug = false
debug-assertions = false
codegen-units = 1
incremental = false
overflow-checks = true

