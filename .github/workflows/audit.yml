name: Security Audit

# Scans Cargo.lock for crates with known RustSec advisories.
#
# Runs on dependency changes, on every PR/push to main, and — crucially — on a
# weekly schedule so a newly-published advisory turns the build red even when no
# code changed. The triage/ignore policy lives in `.cargo/audit.toml` (read
# automatically): today's allow-list is entirely dev-only / test-harness deps,
# so a new advisory in an on-chain contract dependency (cosmwasm-std, cw20,
# k256, the ark-* crypto, …) is NOT pre-ignored and will fail this job.
on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    # Mondays 07:00 UTC — catch advisories published since the last run.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prebuilt binary — no toolchain build needed; cargo-audit only reads the
      # lockfile + advisory DB.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fetches the latest advisory DB and honours `.cargo/audit.toml`.
      - name: Run cargo audit
        run: cargo audit --color always
