name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    # Unit tests only. The integration tests under `tests/` load compiled wasm
    # from `artifacts/` (produced by `make build-all` / `./build_release.sh`)
    # and are run locally / in the release pipeline, not in this clean-checkout
    # gate — a fresh checkout has no artifacts to load.
    - name: Run unit tests
      run: cargo test --workspace --lib --verbose
